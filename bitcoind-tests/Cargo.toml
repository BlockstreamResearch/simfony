[package]
name = "bitcoind-tests"
version = "0.1.0"
authors = ["sanket1729 <sanket1729@gmail.com>"]
edition = "2021"
rust-version = "1.79.0"
publish = false

# Requires ELEMENTSD_EXE; run explicitly with --test spend_utxo, even with --all-features.
[[test]]
name = "spend_utxo"
path = "tests/spend_utxo.rs"
test = false
bench = false

# UNSTABLE: requires BITCOIND_EXE (a Simplicity-enabled Bitcoin node) and the
# `unstable-bitcoin` feature; run explicitly with --features unstable-bitcoin --test bitcoin_spend_utxo.
[[test]]
name = "bitcoin_spend_utxo"
path = "tests/bitcoin_spend_utxo.rs"
required-features = ["unstable-bitcoin"]
test = false
bench = false

[features]
unstable-bitcoin = ["simplicityhl/unstable-bitcoin"]

[dev-dependencies]
simplicityhl = { path = ".." }
elementsd = { version = "0.11.0" }
